<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura GemPop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.5;
        }
        header {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top:0;
            z-index: 99;
            padding: 18px 24px;
            border-bottom: 1px solid #e2e2e7;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        main {
            padding: 48px 24px;
        }
        #productGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
            gap: 32px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }
        .card-body {
            padding: 20px 24px 24px;
        }
        .card-body h3 {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .desc {
            color:#86868b;
            font-size:14px;
            margin-bottom:12px;
        }
        .price {
            font-weight: 600;
            color:#d60012;
            font-size:18px;
        }
        footer {
            text-align:center;
            padding:40px 24px;
            color:#86868b;
            font-size:14px;
            border-top:1px solid #e2e2e7;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Aura GemPop</h1>
        </div>
    </header>
    <main class="container">
        <div id="productGrid"></div>
    </main>
    <footer>© 2026 Aura GemPop. All rights reserved.</footer>

<script>
async function loadProducts(){
  const gridDom = document.getElementById("productGrid");
  try{
    const res = await fetch("/api/functions");
    const productList = await res.json();
    if(!Array.isArray(productList) || productList.length===0){
      gridDom.innerHTML = `<p style="text-align:center;width:100%;padding:60px 0;color:#86868b;font-size:16px;">No products available</p>`;
      return;
    }
    let html = "";
    for(const p of productList){
      html += `
<div class="card">
  <img src="/img/${p.img}" alt="${p.name}">
  <div class="card-body">
    <h3>${p.name}</h3>
    <p class="desc">${p.description}</p>
    <p class="price">${p.price}</p>
  </div>
</div>
`;
    }
    gridDom.innerHTML = html;
  }catch(e){
    gridDom.innerHTML = `<p style="text-align:center;width:100%;padding:60px 0;color:#d60012;font-size:16px;">Load products error</p>`;
    console.error(e);
  }
}
loadProducts();
</script>
</body>
</html>
