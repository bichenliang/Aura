<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura | Fine Jewelry</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{background:#fafafa;color:#111}
nav{padding:24px 6%;display:flex;justify-content:space-between;align-items:center;background:#fff;position:sticky;top:0}
.logo{font-size:22px;font-weight:600}
nav a{margin-left:32px;text-decoration:none;color:#333;font-size:15px}
.hero{padding:110px 6%;text-align:center}
.hero h1{font-size:46px;margin-bottom:18px;font-weight:600}
.hero p{font-size:18px;color:#666;max-width:600px;margin:0 auto 36px}
.btn{display:inline-block;padding:14px 30px;background:#000;color:#fff;text-decoration:none;border-radius:12px;font-size:15px}
.section{padding:70px 6%}
.section h2{text-align:center;font-size:32px;margin-bottom:45px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:30px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #00000007}
.card img{width:100%;height:310px;object-fit:cover}
.card-body{padding:22px}
.card h3{font-size:18px;margin-bottom:7px}
.card p{color:#666;font-size:14px}
footer{padding:45px 6%;background:#fff;text-align:center;color:#777;font-size:14px}
</style>
</head>
<body>
