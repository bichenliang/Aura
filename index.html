<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura GemPop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,Roboto,sans-serif;}

/* 苹果风格：毛玻璃粘性导航栏 */
body{background:#f5f5f7;color:#111;}
nav{
  padding:24px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:rgba(255,255,255,0.72);
  backdrop-filter:blur(18px) saturate(180%);
  border-bottom:1px solid rgba(0,0,0,0.06);
}
.logo{font-size:22px;font-weight:600;}
nav a{margin-left:32px;text-decoration:none;color:#333;font-size:15px;transition:color 0.2s;}
nav a:hover{color:#000;}

.grid{
  padding:60px 6%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:30px;
  max-width:1240px;
  margin:0 auto;
}

/* 苹果卡片 + hover悬浮上浮动画 */
.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,0.05);
  transition:transform 0.3s cubic‑bezier(0.25,0.8,0.25,1), box‑shadow 0.3s ease;
}
.card:hover{
  transform:translateY(-7px);
  box-shadow:0 18px 35px rgba(0,0,0,0.09);
}
.card img{width:100%;height:310px;object‑fit:cover;}
.card‑body{padding:22px;}
.card h3{font‑size:18px;margin‑bottom:8px;font‑weight:500;}
.desc{font‑size:14px;color:#666;margin‑bottom:6px;line‑height:1.45;}
.price{font‑size:15px;font‑weight:500;}

footer{padding:50px 6%;text‑align:center;color:#777;font‑size:14px;}
</style>
</head>
<body>
<nav>
  <div class="logo">Aura GemPop</div>
  <div>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<div class="grid" id="productGrid">
  <p style="text‑align:center;width:100%;padding:60px 0;color:#777;">Loading products…</p>
</div>

<footer>© 2026 Aura GemPop. All rights reserved.</footer>

<script>
async function loadProducts(){
  const gridDom = document.getElementById("productGrid");
  try{
    const res = await fetch("/api/products");
    const productList = await res.json();
    if(!Array.isArray(productList) || productList.length===0){
      gridDom.innerHTML = `<p style="text‑align:center;width:100%;padding:60px 0;color:#888;">No products available</p>`;
      return;
    }
    let html = "";
    for(const p of productList){
      html += `
<div class="card">
  <img src="/img/${p.img}" alt="${p.name}">
  <div class="card‑body">
    <h3>${p.name}</h3>
    <p class="desc">${p.description}</p>
    <p class="price">${p.price}</p>
  </div>
</div>
`;
    }
    gridDom.innerHTML = html;
  }catch(e){
    gridDom.innerHTML = `<p style="text‑align:center;width:100%;padding:60px 0;color:red;">Load products error</p>`;
    console.error(e);
  }
}
loadProducts();
</script>
</body>
</html>
